                - application-system
                - tutorials
    variables:
        VIVADO_VERSION: '2025.1.1'
        VIVADO_PATH: '/opt/fpga/Xilinx/$VIVADO_VERSION'
    before_script:
        - *install-prereqs
        - 'python3 -m pip install ./vivado'
    script:
        - 'source $VIVADO_PATH/Vivado/settings64.sh'
        # See https://support.xilinx.com/s/question/0D52E000079NURRSA4/synthesis-failed-abnormal-termination-tcmalloc-large-allocation?language=en_US
        - export LD_PRELOAD=/lib/x86_64-linux-gnu/libudev.so.1
        - 'mkdir -p ci-debug'
        - 'bash -o pipefail -c ''cd test && ./test_backend.sh vivado "$TEST_SCOPE" 2>&1 | tee "../ci-debug/test_backend_vivado_${VIVADO_VERSION}_${TEST_SCOPE}.log"'''
    after_script: *collect-test-debug
    artifacts: *test-artifacts
    except:
        variables:
            [ $VIVADO_DISABLE == 'true' ]
    tags:
        - fpga

test-quartus 19.4:
    stage: test-backends
    resource_group: quartus-19.4-simulation
    parallel:
        matrix:
            - TEST_SCOPE:
                - node
                - application-system
                - tutorials
    variables:
        QUARTUS_VERSION: '19.4'
        QUARTUS_PATH: '/opt/fpga/intelFPGA_pro/$QUARTUS_VERSION'
    before_script:
        - *install-prereqs
        - 'python3 -m pip install ./quartus'
    script:
        - *setup-quartus-19-4
        - 'mkdir -p ci-debug'
        - 'bash -o pipefail -c ''cd test && ./test_backend.sh quartus "$TEST_SCOPE" 2>&1 | tee "../ci-debug/test_backend_quartus_${QUARTUS_VERSION}_${TEST_SCOPE}.log"'''
    after_script: *collect-test-debug
    artifacts: *test-artifacts
    except:
        variables:
            [ $QUARTUS_DISABLE == 'true' ]
    tags:
        - fpga

test-multibackend end-to-end:
    stage: test-backends
    resource_group: quartus-19.4-simulation
    parallel:
        matrix:
            - TEST_SCOPE:
                - node
                - application
    variables:
        VIVADO_VERSION: '2022.2'
        VIVADO_PATH: '/opt/fpga/Xilinx/Vivado/$VIVADO_VERSION'
        QUARTUS_VERSION: '19.4'
        QUARTUS_PATH: '/opt/fpga/intelFPGA_pro/$QUARTUS_VERSION'
    before_script:
        - *install-prereqs
        - 'python3 -m pip install ./vivado ./quartus'
    script:
        - *setup-quartus-19-4
        - 'mkdir -p ci-debug'
        - 'bash -o pipefail -c ''./test/test_multibackend.sh "$TEST_SCOPE" 2>&1 | tee "ci-debug/test_multibackend_${TEST_SCOPE}.log"'''
    after_script: *collect-test-debug
    artifacts: *test-artifacts
    tags:
        - fpga
